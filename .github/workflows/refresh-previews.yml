name: Refresh preview assets

on:
  push:
    branches:
      - agent/fix-shell-interactions
    paths:
      - "assets/**"
      - "captures/home/index-account-menu-open/**"
      - "tools/refresh-previews.mjs"
      - "tools/process-open-account-capture.mjs"
      - ".github/workflows/refresh-previews.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip preview refresh]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process open account drawer capture
        if: ${{ hashFiles('captures/home/index-account-menu-open/index-account-menu-open.singlefile.html.gz.b64') != '' }}
        run: node tools/process-open-account-capture.mjs

      - name: Inject shared CSS and JavaScript
        run: npm run refresh-previews

      - name: Commit generated captures and previews
        run: |
          if git diff --quiet -- captures analysis pages; then
            echo "Generated files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures analysis pages
          git commit -m "Process open account drawer capture [skip preview refresh]"
          git push
